name: Windows origin-aware symlink strategy experiment
on:
  push:
    branches:
      - diagnostics/windows-relative-source-links-v1
permissions:
  contents: read
jobs:
  windows-strategy:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Compare origin-aware native path strategy
        run: python .github/diagnostics/v3_origin_aware_probe.py windows-origin-aware.json
      - name: Save experimental results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-origin-aware-report
          path: windows-origin-aware.json
          retention-days: 7
